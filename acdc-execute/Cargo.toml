[package]
name = "acdc-execute"
version = "0.1.0"
edition.workspace = true
description = "Discover and run command blocks defined in AsciiDoc documents."
license.workspace = true
repository = "https://github.com/nlopes/acdc"
keywords = ["asciidoc", "command-runner", "task-runner"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[lints]
workspace = true

[features]
default = ["pre-spec-subs", "setext"]
pre-spec-subs = ["acdc-parser/pre-spec-subs", "acdc-converters-core/pre-spec-subs"]
setext = ["acdc-parser/setext"]
network = ["acdc-parser/network"]

[dependencies]
acdc-converters-core.workspace = true
acdc-parser.workspace = true
petgraph.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
rstest.workspace = true
