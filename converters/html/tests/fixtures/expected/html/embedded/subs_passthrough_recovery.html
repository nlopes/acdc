</div>

<p>Macros then escaping: pass:m,c[https://example.org[Site\]].</p>
</div>
<div class="paragraph">
<p>Unknown: pass:typo[&lt;script&gt;unsafe&lt;/script&gt; *Text*].</p>

</div>

<p>Valid quotes: &lt;tag&gt; <strong>Bold</strong>.</p>
</div>

<p>Protected: pass:q,c[*Text*].</p>
</div>
