name: AsciiDoc TCK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tck.yml'
      - '.github/tck/**'
      - 'acdc-parser/**'
      - 'acdc-cli/**'
      - 'converters/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: ['*']
    paths:
      - '.github/workflows/tck.yml'
      - '.github/tck/**'
      - 'acdc-parser/**'
      - 'acdc-cli/**'
      - 'converters/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  tck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        path: acdc

    - name: Clone asciidoc-tck
      run: |
        git init asciidoc-tck
        git -C asciidoc-tck remote add origin https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-tck.git
        git -C asciidoc-tck fetch --depth 1 origin cdfada9c2768b164eadf4bc12e9f9c68e6caf68a
        git -C asciidoc-tck checkout --detach FETCH_HEAD
        test "$(git -C asciidoc-tck rev-parse HEAD)" = cdfada9c2768b164eadf4bc12e9f9c68e6caf68a

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Setup Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: acdc
        env-vars: ImageOS

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '25.8.2'
        cache: 'npm'
        cache-dependency-path: asciidoc-tck/package-lock.json

    - name: Build acdc with TCK feature
      working-directory: acdc
      run: cargo build -p acdc-cli --no-default-features --features tck

    - name: Install asciidoc-tck dependencies
      working-directory: asciidoc-tck
      run: npm ci

    - name: Test the compatibility gate
      working-directory: acdc
      run: node --test .github/tck/check.test.mjs

    - name: Check TCK compatibility
      working-directory: acdc
      run: node .github/tck/check.mjs ../asciidoc-tck target/debug/acdc
