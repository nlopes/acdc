[package]
name = "acdc-parser"
description = "`AsciiDoc` parser"
version = "0.10.0"
edition.workspace = true
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nlopes/acdc"
documentation = "https://docs.rs/acdc-parser"
keywords = ["asciidoc", "parser", "markup"]
categories = ["parsing", "text-processing"]
exclude = [
    "AGENTS.md",
    "README.adoc",
    "benches/",
    "examples/",
    "fixtures/",
    "proptest-regressions/",
    "src/proptests/",
    "tests/",
]

[features]
default = ["pre-spec-subs"]
network = ["dep:ureq"]
setext = []  # Enable Setext-style (underlined) header parsing
# Asciidoctor-compatible subs= attribute. Experimental - may be removed when AsciiDoc spec finalizes.
# See: https://gitlab.eclipse.org/eclipse/asciidoc-lang/asciidoc-lang/-/issues/16
pre-spec-subs = []

[dependencies]
bitflags = "2.11"
bumpalo = { version = "3", features = ["collections"] }
chrono.workspace = true
csv = "1.4"
encoding_rs = "0.8"
evalexpr = "13"
peg = "0.8.6"
regex-syntax = { version = "0.8", default-features = false, features = ["unicode-perl"] }
rustc-hash.workspace = true
self_cell = "1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
url = "2.5"

# Bare WebAssembly has no system sockets. The host must fetch include content.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
ureq = { version = "3.1", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
crossterm = "0.29"
pretty_assertions.workspace = true
proptest = "1.9"
rstest.workspace = true
# Tiny tracking global allocator for the `no_leak` integration test. Encapsulates
# its own `unsafe impl GlobalAlloc` so the workspace `forbid(unsafe_code)` lint
# stays untouched.
stats_alloc = "0.1"
# Integration tests must also capture events from the parser crate.
tracing-test = { workspace = true, features = ["no-env-filter"] }

[[bench]]
name = "parser_bench"
harness = false

# Include / partial-include perf bench. Disabled by default (`bench`/`test` = false)
# so `cargo bench`, `cargo test`, and CI never run it — it generates temp fixtures
# and takes minutes. Run on demand: `cargo bench --bench f1_include_bench`.
[[bench]]
name = "f1_include_bench"
harness = false
bench = false
test = false

# Active/inactive block-conditional benchmark. Disabled by default so ordinary
# workspace bench/test commands skip the longer Criterion run. Run on demand:
# `cargo bench --bench conditional_bench`.
[[bench]]
name = "conditional_bench"
harness = false
bench = false
test = false

[lints]
workspace = true
